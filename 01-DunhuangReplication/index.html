<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual Replication of Dunhuang Cave 285 Ceiling — Tiange Xiang Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Lora:ital,wght@0,400;1,400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="project.css" />
</head>
<body
  class="wrapper project-page dunhuang-page"
  data-text="text-content.txt"
  data-next="../02-GatehouseReplication/"
>
  <div class="bg-atmosphere" aria-hidden="true"></div>
  <canvas id="meteor-layer" data-variant="subpage" aria-hidden="true"></canvas>

  <article class="dh-page">
    <a class="dh-back" href="../">← Monument</a>

    <header class="dh-header">
      <h1 class="dh-title">
        <span class="dh-title-line">Visual Replication of</span>
        <span class="dh-title-line">Dunhuang Cave 285 Ceiling</span>
      </h1>
    </header>

    <figure class="dh-hero">
      <img src="hero.jpg" alt="Replicated Dunhuang Cave 285 caisson ceiling" width="900" height="900" loading="eager" />
    </figure>

    <div id="dh-intro" class="dh-prose" aria-live="polite"></div>

    <div class="dh-process" role="group" aria-label="Replication process">
      <figure class="dh-process__item">
        <img src="process1.jpg" alt="Workshop construction of the caisson form, step one" width="640" height="480" loading="lazy" />
      </figure>
      <figure class="dh-process__item">
        <img src="process2.jpg" alt="Workshop construction of the caisson form, step two" width="640" height="480" loading="lazy" />
      </figure>
      <figure class="dh-process__item">
        <img src="process3.jpg" alt="Workshop construction of the caisson form, step three" width="640" height="480" loading="lazy" />
      </figure>
    </div>

    <div id="dh-mid1" class="dh-prose"></div>

    <div class="dh-zaojing-pair">
      <figure class="dh-zaojing">
        <img src="zaojing-OG.jpg" alt="Central zaojing lotus pattern from Cave 285" width="520" height="520" loading="lazy" />
      </figure>
      <figure class="dh-zaojing">
        <img src="zaojing-sketch.jpg" alt="Zaojing line drawing study" width="520" height="520" loading="lazy" />
      </figure>
    </div>

    <figure class="dh-lotus">
      <img src="lotus.jpg" alt="Lotus throne motif reference" width="280" height="280" loading="lazy" />
    </figure>

    <div id="dh-mid2" class="dh-prose"></div>

    <section class="dh-split" aria-label="Ceiling and narrative">
      <figure class="dh-split__media">
        <img src="preview-1.jpg" alt="Ceiling and wall mural in the replicated cave space" width="640" height="960" loading="lazy" />
      </figure>
      <div id="dh-split-text" class="dh-prose dh-prose--split"></div>
    </section>

    <div id="dh-exhi-lead" class="dh-prose"></div>

    <figure class="dh-exhi">
      <img src="exhi-preview.jpg" alt="Exhibition installation of the replication" width="1200" height="675" loading="lazy" />
    </figure>

    <div id="dh-final" class="dh-prose"></div>

    <footer class="dh-footer">
      <a id="project-next" class="dh-next" href="../02-GatehouseReplication/">click to see my next project</a>
    </footer>
  </article>

  <script src="../meteor.js"></script>
  <script src="dunhuang-page.js"></script>
</body>
</html>
