<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>'Across the Wheat Field': Data & Memory on the Border — Tiange Xiang Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Lora:ital,wght@0,400;1,400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="project.css" />
</head>
<body
  class="wrapper project-page yunnan-page"
  data-text="text-content.txt"
  data-next="../04-FolkrhymeArchiving/"
>
  <div class="bg-atmosphere" aria-hidden="true"></div>
  <canvas id="meteor-layer" data-variant="subpage" aria-hidden="true"></canvas>

  <article class="yt-page">
    <a class="yt-back" href="../">← Monument</a>

    <header class="yt-header">
      <h1 class="yt-title">
        <span class="yt-title-line">'Across the Wheat Field':</span>
        <span class="yt-title-line">Data & Memory on the Border</span>
      </h1>
      <p class="yt-year">2023–至今</p>
    </header>

    <div class="yt-hero-pair" role="group" aria-label="Fieldwork on the border">
      <figure class="yt-hero-pair__item">
        <img
          src="hero.JPG"
          alt="Group of children and volunteers gathered outdoors under a tree"
          width="640"
          height="440"
          loading="eager"
        />
      </figure>
      <figure class="yt-hero-pair__item">
        <img
          src="progress.JPG"
          alt="Volunteer and child seated together in a village setting"
          width="640"
          height="440"
          loading="eager"
        />
      </figure>
    </div>

    <div id="yt-intro" class="yt-prose yt-prose--left" aria-live="polite"></div>

    <figure class="yt-database">
      <img
        src="database.jfif"
        alt="Children's Growth Database interface with student profiles"
        width="960"
        height="540"
        loading="lazy"
      />
    </figure>

    <div id="yt-mid1" class="yt-prose yt-prose--left"></div>

    <div id="yt-mid2" class="yt-prose yt-prose--left"></div>

    <section class="yt-carving" aria-label="Wall carving and incantation">
      <figure class="yt-carving__media">
        <img
          src="LisuWall-detail.jpg"
          alt="Lisu pictographic script carved on a village wall"
          width="640"
          height="800"
          loading="lazy"
        />
      </figure>
      <blockquote id="yt-poem" class="yt-poem" cite=""></blockquote>
    </section>

    <figure class="yt-wall">
      <img
        src="LisuWall.jpg"
        alt="Wide view of Lisu pictographic script on a village wall"
        width="1200"
        height="675"
        loading="lazy"
      />
    </figure>

    <section class="yt-erasure" aria-label="Removal of the wall carvings">
      <div id="yt-mid3" class="yt-prose yt-prose--split"></div>
      <figure class="yt-erasure__media">
        <img
          src="removed.jpg"
          alt="Worker painting over Lisu wall carvings with white paint"
          width="800"
          height="500"
          loading="lazy"
        />
      </figure>
    </section>

    <div id="yt-final" class="yt-prose yt-prose--final"></div>

    <footer class="yt-footer">
      <a id="project-next" class="yt-next" href="../04-FolkrhymeArchiving/">click to see my next project</a>
    </footer>
  </article>

  <script src="../meteor.js"></script>
  <script src="volunteer-page.js"></script>
</body>
</html>
