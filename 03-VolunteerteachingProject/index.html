            <div class="yt-db-bubble" data-id="logo" style="top: 2.5%; left: 2%;">
              <p>Midsummer Self × Rural Arts Education Database</p>
            </div>
            <div class="yt-db-bubble yt-db-bubble--nav" data-id="nav" style="top: 2.5%; left: 52%;">

            </div>
            <div class="yt-db-bubble yt-db-bubble--wide" data-id="intro-1" style="top: 11%; left: 10%;">
              <p>The <em>Midsummer Self</em> Rural Arts Education Digital Archive is a qualitative longitudinal report (QLR) written by the <em>Across the Wheat Field</em> arts education team for rural children in Yunnan. Within an education system that judges children almost solely by grades, <em>Midsummer Self</em> is dedicated to tracing the growth trajectories that rural children are so often made invisible.</p>
            </div>
            <div class="yt-db-bubble yt-db-bubble--wide" data-id="intro-2" style="top: 21%; left: 10%;">
              <p>With the informed consent of participants, we present—to the children themselves, their families, their schools, and the public—the developmental trajectories of each child across four dimensions: (a) interests and hobbies, (b) personality and mental health, (c) social behavior, and (d) external environment (with emphasis on schooling, family upbringing, and broader social education policy). By organizing the firsthand material gathered as <em>Across the Wheat Field</em> worked with children in the Gaoligong Mountains, we conduct micro-level qualitative observation alongside quantitative data analysis, attempting to make visible the macro-scale deficits of rural education in China. In strict adherence to anthropological research ethics and applicable law, the open-source <em>Midsummer Self</em> archive is offered as a modest contribution—a comparative resource for public-interest organizations and researchers who care about rural education in China.</p>
            </div>
            <div class="yt-db-bubble yt-db-bubble--title" data-id="title" style="top: 36%; left: 8%;">
              <p>Gaoligongshan Rural Children Qualitative Archive (2021–2023)</p>
            </div>
